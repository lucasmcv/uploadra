# Fly.io app config for the Next.js web service. Draft — written without a
# Fly.io account to test against (see scripts/deployment/platform_inventory.py
# for the full list of env vars this service needs at runtime). Before the
# first real deploy: run `fly launch --no-deploy` from repo root to let Fly
# generate/adjust this against your actual account, then reconcile with this
# file rather than blindly overwriting it — this one already has the
# app-specific settings (port, health check) `fly launch` won't know.

app = "dictado-web"           # change if this name is taken on Fly.io
primary_region = "REGION_AQUI" # run `fly platform regions` and pick the closest to your users

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/login"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets (never in this file — set via `fly secrets set NAME=value`, once
# per app, before the first deploy):
#   DATABASE_URL, AUTH_SECRET, S3_ACCESS_KEY, S3_SECRET_KEY, GEMINI_API_KEY,
#   STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET,
#   INTERNAL_CALLBACK_SECRET
# Non-secret env vars go in [env] instead, once WORKER_URL and the S3/region
# values are known (see platform_inventory.py — most stay identical to the
# local docker-compose.yml values except S3_ENDPOINT/S3_PUBLIC_ENDPOINT,
# which go empty for real AWS S3, and WORKER_URL/NEXT_PUBLIC_APP_URL, which
# become the .internal Fly hostnames instead of the docker-compose ones).
