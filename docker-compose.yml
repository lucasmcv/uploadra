services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/videos
      "

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Local dev default matches the `postgres` service above; production
      # overrides this in its own .env with the real deployed credentials
      # (never hardcode those here — see docs/DEPLOYMENT.md).
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/app}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Auth.js refuses requests against an "untrusted" host in production
      # unless told otherwise — we're not on Vercel (which sets this
      # automatically), so it needs to be explicit here.
      AUTH_TRUST_HOST: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      # Presigned GET URLs are followed by the user's browser, which can't
      # resolve the "minio" service hostname — only S3_ENDPOINT (used for
      # server-to-server calls) needs that; presigning needs the URL the
      # host machine can actually reach.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: videos
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      # The browser-facing address — used for Stripe Checkout/Portal
      # redirects.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      # Encrypts per-user Gemini API keys (BYOK, see lib/crypto.ts) at
      # rest — any string works, it's hashed to a 32-byte AES key.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRODUCT_ID: ${STRIPE_PRODUCT_ID:-}
      BILLING_RECONCILE_SECRET: ${BILLING_RECONCILE_SECRET:-dev-only-shared-secret-change-me}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
