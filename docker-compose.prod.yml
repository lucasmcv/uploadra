# Production-only override — adds the reverse proxy/HTTPS layer that local
# dev doesn't need (local just hits web:3000 directly). Apply on top of the
# base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy was previously run as a one-off `docker run` container outside of
# Compose entirely, which meant it wasn't tracked as a managed service —
# a `docker compose up --remove-orphans` (run to clean out other, actually
# unused containers) deleted it along with them, taking the public site
# down until it was manually recreated. Bringing it under Compose here
# means it can never again look like an "orphan" to be swept away.
services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio

volumes:
  caddy_data:
    external: true
    name: uploadra_caddy_data
  caddy_config:
    external: true
    name: uploadra_caddy_config
